<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Seguridad Infantil | Perfil Único</title>
    <meta name="description" content="Perfil oficial de identificación y contacto de emergencia para seguridad infantil mediante pulsera NFC.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-default">

    <!-- Ambient Dynamic Glow Bubbles -->
    <div class="bg-bubbles">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
    </div>

    <!-- Minimal Clean Header (No nav links to other profiles) -->
    <header class="app-header" style="justify-content: center;">
        <div class="brand-logo" style="cursor: default;">
            <div class="brand-icon">
                <i class="fa-solid fa-shield-cat"></i>
            </div>
            <span>NFC<span style="color: var(--accent-main)">Infantil</span></span>
        </div>
    </header>

    <main class="container">

        <!-- ===================================================================
             PÁGINA PÚBLICA ÚNICA Y 100% AISLADA DEL NIÑO O NIÑA
             =================================================================== -->
        <section id="view-profile" class="view-section active-view">
            <div class="profile-container" style="margin-top: 0.5rem;">

                <!-- MAIN SINGLE CHILD CARD -->
                <div class="profile-card">
                    <div class="profile-card-desktop-split">
                        
                        <!-- LEFT COLUMN: PHOTO & LOGO BANNER -->
                        <div class="profile-left-column">
                            <!-- Status Bar -->
                            <div class="profile-badge-bar">
                                <span class="theme-badge" id="p-badge">
                                    <i class="fa-solid fa-child"></i> <span id="p-gender-text">Perfil Infantil</span>
                                </span>
                                <div class="nfc-live-dot">
                                    <span class="pulse-dot"></span>
                                    <span>NFC Activo</span>
                                </div>
                            </div>

                            <!-- Photo Avatar -->
                            <div class="profile-avatar-wrapper">
                                <img src="" alt="Foto Niño/a" id="p-avatar" class="profile-avatar-img">
                            </div>

                            <!-- Official NFC Seguridad Infantil Logo Banner below Photo -->
                            <div class="logo-banner-wrapper">
                                <img src="assets/logo-nfc-seguridad.png" alt="NFC Seguridad Infantil" class="logo-banner-img">
                            </div>
                        </div>

                        <!-- RIGHT COLUMN: CORE SINGLE CHILD DATA & ACTION BUTTONS -->
                        <div class="profile-right-column">
                            
                            <!-- Information Grid -->
                            <div class="info-cards-grid">
                                <!-- Nombre del Niño/a -->
                                <div class="info-box">
                                    <div class="info-icon icon-parent">
                                        <i class="fa-solid fa-user"></i>
                                    </div>
                                    <div class="info-content">
                                        <span class="label">Nombre</span>
                                        <span class="val" id="p-name" style="font-size: 1.35rem;">Cargando...</span>
                                    </div>
                                </div>

                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem;">
                                    <!-- Edad -->
                                    <div class="info-box">
                                        <div class="info-icon icon-age">
                                            <i class="fa-solid fa-cake-candles"></i>
                                        </div>
                                        <div class="info-content">
                                            <span class="label">Edad</span>
                                            <span class="val"><span id="p-age">0</span> años</span>
                                        </div>
                                    </div>
                                    <!-- Tipo de Sangre -->
                                    <div class="info-box">
                                        <div class="info-icon icon-blood">
                                            <i class="fa-solid fa-droplet"></i>
                                        </div>
                                        <div class="info-content">
                                            <span class="label">Tipo de sangre</span>
                                            <span class="val" id="p-blood">O+</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons Stack (WhatsApp & Location) -->
                            <div class="profile-actions-stack">
                                <a href="#" id="btn-whatsapp-action" target="_blank" class="btn btn-whatsapp btn-block">
                                    <i class="fa-brands fa-whatsapp"></i> CONTACTAR A MIS PAPÁS
                                </a>
                                
                                <a href="#" id="btn-location-action" target="_blank" class="btn btn-maps btn-block">
                                    <i class="fa-solid fa-location-dot"></i> UBICACIÓN
                                </a>
                            </div>

                            <!-- Footer Tagline -->
                            <div class="footer-credits">
                                <i class="fa-solid fa-heart" style="color: var(--danger)"></i> GRACIAS POR AYUDARME
                            </div>

                        </div>

                    </div>
                </div>

            </div>
        </section>

        <!-- INACTIVE PROFILE SCREEN (WHEN PROFILE IS DEACTIVATED OR WRONG URL) -->
        <section id="view-inactive" class="view-section hidden">
            <div class="inactive-screen">
                <div style="font-size: 3.5rem; color: var(--warning); margin-bottom: 1rem;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                </div>
                <h2 style="font-size: 1.6rem; margin-bottom: 0.5rem;" id="inactive-title">Perfil No Disponible</h2>
                <p style="color: var(--text-secondary);" id="inactive-desc">
                    Este perfil no se encuentra disponible actualmente.
                </p>
            </div>
        </section>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="toast-msg hidden"></div>

    <script src="app.js"></script>
</body>
</html>
